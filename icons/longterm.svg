<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sailfish OS Blue Outer Gradient -->
    <linearGradient id="sailfishBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A0FF"/>
      <stop offset="100%" stop-color="#0055CC"/>
    </linearGradient>

    <!-- Inner Dark Screen Gradient -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0F1116"/>
    </linearGradient>
  </defs>

  <!-- Sailfish OS Icon Base (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#sailfishBg)"/>

  <!-- Outer Highlight Rim -->
  <rect x="34" y="34" width="444" height="444" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Terminal Window Container -->
  <rect x="106" y="106" width="300" height="300" rx="56" fill="url(#screenBg)" stroke="#2C3240" stroke-width="4"/>

  <!-- Terminal Inner Bevel/Shadow -->
  <rect x="108" y="108" width="296" height="296" rx="54" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="6"/>

  <!-- Terminal Prompt Symbol ( > ) -->
  <path d="M 152 158 L 182 184 L 152 210" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Block Cursor ( █ ) -->
  <rect x="200" y="154" width="26" height="60" rx="4" fill="#FFFFFF"/>
</svg>
